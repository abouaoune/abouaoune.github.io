<!DOCTYPE html>
<html>
<head>
    <title>Update CSV with Distances</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC221DeGp0nazZR6DLQbmSULU662Nj6zuk&libraries=geometry"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        function initMap() {
            var HdV_Drummondville_Location = new google.maps.LatLng(45.880662, -72.484140);
            var resultsArray = [];

            // Load CSV data
            Papa.parse('CL_Drummondville_MapData_9k.csv', {
                download: true,
                header: true,
                complete: function(results) {
                    var data = results.data;
                    var remaining = data.length;

                    data.forEach(function(client) {
                        var lat = parseFloat(client.Latitude);
                        var lng = parseFloat(client.Longitude);

                        if (!isNaN(lat) && !isNaN(lng)) {
                            var latLng = new google.maps.LatLng(lat, lng);
                            var distanceToHdV = google.maps.geometry.spherical.computeDistanceBetween(latLng, HdV_Drummondville_Location);

                            resultsArray.push({
                                ...client,
                                distanceToHdV: distanceToHdV
                            });
                        } else {
                            console.error('Invalid coordinates for client:', client);
                        }

                        remaining--;
                        if (remaining === 0) {
                            // All calculations complete, generate new CSV
                            var csv = Papa.unparse(resultsArray);
                            downloadCSV(csv, 'CL_Drummondville_MapData_9k_updated.csv');
                        }
                    });
                }
            });
        }

        // Function to download CSV file
        function downloadCSV(csv, filename) {
            var csvFile;
            var downloadLink;

            // CSV file
            csvFile = new Blob([csv], {type: "text/csv"});

            // Download link
            downloadLink = document.createElement("a");

            // File name
            downloadLink.download = filename;

            // Create a link to the file
            downloadLink.href = window.URL.createObjectURL(csvFile);

            // Hide download link
            downloadLink.style.display = "none";

            // Add the link to DOM
            document.body.appendChild(downloadLink);

            // Click download link
            downloadLink.click();
        }
    </script>
</head>
<body onload="initMap()">
    <h1>Updating CSV with Distances...</h1>
</body>
</html>
